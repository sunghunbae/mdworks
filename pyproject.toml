[project]
name = "mdworks"
version = "0.4.1"
authors = [{name = "Sung-Hun Bae", email = "sunghun.bae@gmail.com"}]
requires-python = ">= 3.11"
dependencies = []

[project.scripts]
mmcif = "mdworks.mmcif:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"

[tool.pixi.dependencies]
openmm = ">=8.4.0,<9"
openmmforcefields = ">=0.15.1,<0.16"
pdbfixer = ">=1.12,<2"
mdanalysis = ">=2.10.0,<3"
ipykernel = ">=7.1.0,<8"
biopython = ">=1.86,<2"
openmmtools = ">=0.26.0,<0.27"
cuda-version = "13.0.*"
ambertools = { version = ">=24.8,<25", channel = "conda-forge" }
compilers = { version = ">=1.11.0,<2", channel = "conda-forge" }
rich = ">=14.3.2,<15"

[tool.pixi.pypi-dependencies]
typer = ">=0.21.1, <0.22"
mdworks = { path = ".", editable = true }

[tool.pixi.package.host-dependencies]
hatchling = "*"
uv = "*"

[tool.pixi.tasks]

