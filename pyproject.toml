[project]
name = "mdworks"
version = "0.26.2"
description = "Streamlines preparation and equilibration of molecular complex for MD simulations"
readme = "README.md"
authors = [{name = "Sung-Hun Bae", email = "sunghun.bae@gmail.com"}]
requires-python = ">= 3.11"
dependencies = [
    "gemmi>=0.7.5,<0.8",
    "cyclopts>=4.22.0,<5",
    "biopython>=1.86,<2",
    "pdb2pqr>=3.6.1,<4",
] 

[project.scripts]
mdworks = "mdworks.commands:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"

[tool.pixi.dependencies]
cuda-version = "==13.1"
openmm = ">=8.4.0,<9"
openmmforcefields = ">=0.15.1,<0.16"
pdbfixer = ">=1.12,<2"
mdanalysis = ">=2.10.0,<3"
biopython = ">=1.86,<2"
openmmtools = ">=0.26.0,<0.27"
ambertools = ">=24.8,<25"
compilers = { version = ">=1.11.0,<2", channel = "conda-forge" }
rich = ">=14.3.2,<15"
uv = ">=0.10.0,<0.11"
pdb2pqr = ">=3.6.1,<4"
gemmi = ">=0.7.5,<0.8"
cyclopts = ">=4.22.0,<5"
ipykernel = ">=7.1.0,<8"
twine = ">=6.2.0,<7"
openff-nagl = ">=0.5.5,<0.6"

[tool.pixi.pypi-dependencies]
mdworks = { path = ".", editable = true }

[tool.pixi.package.host-dependencies]
hatchling = ">=1.28.0,<2"
uv = ">=0.10.0,<0.11"

[tool.pixi.tasks]
build-pypi = "uv build; pixi install"
build-conda = "pixi build --output-dir build; pixi install"

[tool.hatch.build.targets.wheel]
packages = ["src/mdworks"]
